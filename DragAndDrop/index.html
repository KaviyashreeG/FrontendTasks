<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop Image Cards</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="card" draggable="true" data-id="1">
            <img src="asset\naruto.jpeg" alt="naruto">
        </div>
        <div class="card" draggable="true" data-id="2">
            <img src="asset\one-piece.jpeg" alt="Norwegian wood">
        </div>
        <div class="card" draggable="true" data-id="3">
            <img src="asset\solo-levelling.jpeg" alt="It series">
        </div>
        <div class="card empty" data-id="4">
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
